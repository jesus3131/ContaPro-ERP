apiVersion: apps/v1
kind: Deployment
metadata:
  name: contapro-backend
  labels:
    app: contapro
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: contapro
      component: backend
  template:
    metadata:
      labels:
        app: contapro
        component: backend
    spec:
      containers:
      - name: backend
        image: contapro/backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql+psycopg://contapro:contapro123@postgres-service:5432/contapro_erp"
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: contapro-secrets
              key: secret-key
        - name: CORS_ORIGINS
          value: '["https://contapro.com"]'
        - name: DIAN_TEST_MODE
          value: "true"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: contapro-secrets
              key: openai-key
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contapro-frontend
  labels:
    app: contapro
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: contapro
      component: frontend
  template:
    metadata:
      labels:
        app: contapro
        component: frontend
    spec:
      containers:
      - name: frontend
        image: contapro/frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: BACKEND_URL
          value: "http://backend-service:8000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  ports:
  - port: 5432
  selector:
    app: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  ports:
  - port: 6379
  selector:
    app: redis
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: contapro
    component: backend
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: contapro
    component: frontend
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: contapro-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - host: contapro.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 3000
